<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ErgouCompress · 桌面交互原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true">
      <defs>
        <symbol id="folder" viewBox="0 0 24 24">
          <path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2h8v2" />
        </symbol>
        <symbol id="queue" viewBox="0 0 24 24">
          <path d="m4 5 5 3-5 3zM13 6h7M13 10h7M4 16h16M4 20h12" />
        </symbol>
        <symbol id="history" viewBox="0 0 24 24">
          <path d="M4 9a9 9 0 1 1 0 7M4 4v5h5M12 7v6l4 2" />
        </symbol>
        <symbol id="storage" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M3 14h18M7 17h.1M11 17h.1M7 8h10" />
        </symbol>
        <symbol id="settings" viewBox="0 0 24 24">
          <path
            d="m9 3-1 3-3 1-2 4 2 3v3l4 3 3-1 3 1 4-3v-3l2-3-2-4-3-1-1-3z"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="search" viewBox="0 0 24 24">
          <circle cx="10" cy="10" r="6" />
          <path d="m15 15 5 5" />
        </symbol>
        <symbol id="arrow" viewBox="0 0 24 24">
          <path d="M4 12h16m-6-6 6 6-6 6" />
        </symbol>
        <symbol id="check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="shield" viewBox="0 0 24 24">
          <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6" />
        </symbol>
        <symbol id="info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6M12 7h.1" />
        </symbol>
        <symbol id="close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="pause" viewBox="0 0 24 24">
          <path d="M8 5v14M16 5v14" />
        </symbol>
        <symbol id="play" viewBox="0 0 24 24">
          <path d="m7 4 13 8-13 8z" />
        </symbol>
        <symbol id="lock" viewBox="0 0 24 24">
          <rect x="5" y="10" width="14" height="11" rx="2" />
          <path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3" />
        </symbol>
        <symbol id="sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"
          />
        </symbol>
        <symbol id="file" viewBox="0 0 24 24">
          <path d="M5 3h9l5 5v13H5zM14 3v6h5" />
          <path d="m9 12 6 3-6 3z" />
        </symbol>
        <symbol id="download" viewBox="0 0 24 24">
          <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
        </symbol>
      </defs>
    </svg>
    <div class="app-shell">
      <header class="titlebar">
        <a class="brand" href="#workspace" aria-label="ErgouCompress 工作台"
          ><span class="brand-mark">E<span></span></span
          ><strong>ErgouCompress</strong><span class="title-divider"></span
          ><span class="prototype-label">桌面体验 · HTML 原型</span></a
        >
        <div class="title-tools">
          <button class="text-button" data-action="design-notes">
            设计说明</button
          ><button
            class="icon-button"
            data-action="theme"
            aria-label="切换深浅主题"
          >
            <svg><use href="#sun" /></svg>
          </button>
          <div class="window-glyphs" aria-hidden="true">—　□　×</div>
        </div>
      </header>
      <aside class="sidebar">
        <div class="sidebar-top">
          <span class="eyebrow">你的媒体工作台</span>
          <nav aria-label="主要导航">
            <button class="nav-item active" data-view="workspace">
              <svg><use href="#folder" /></svg><span>导入与规划</span></button
            ><button class="nav-item" data-view="queue">
              <svg><use href="#queue" /></svg><span>任务队列</span
              ><b id="queue-nav-count">3</b></button
            ><button class="nav-item" data-view="history">
              <svg><use href="#history" /></svg><span>处理历史</span>
            </button>
            <div class="nav-separator"></div>
            <button class="nav-item" data-view="storage">
              <svg><use href="#storage" /></svg><span>存储与档案</span></button
            ><button class="nav-item" data-view="settings">
              <svg><use href="#settings" /></svg><span>工具与设置</span>
            </button>
          </nav>
        </div>
        <div class="sidebar-bottom">
          <div class="local-card">
            <svg><use href="#shield" /></svg>
            <div>
              <strong>文件始终留在本机</strong
              ><small>副本优先 · 原始版本可追溯</small>
            </div>
          </div>
          <div class="sidebar-disk">
            <div><span>档案所在卷 C:</span><span>可用 256 GB</span></div>
            <div class="thin-meter"><i style="width: 48%"></i></div>
            <small>备份占用会单独统计</small>
          </div>
          <p class="build-label">
            <span class="status-dot"></span>仅模拟交互，不连接文件处理后端
          </p>
        </div>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <div class="dialog-heading">
        <div>
          <span class="eyebrow" id="modal-eyebrow">ErgouCompress</span>
          <h2 id="modal-title"></h2>
        </div>
        <button
          class="icon-button"
          data-action="close-dialog"
          aria-label="关闭对话框"
        >
          <svg><use href="#close" /></svg>
        </button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-footer" class="dialog-footer"></div>
    </dialog>
    <dialog id="drawer" class="drawer">
      <div class="dialog-heading">
        <div>
          <span class="eyebrow" id="drawer-eyebrow">文件详情</span>
          <h2 id="drawer-title"></h2>
        </div>
        <button
          class="icon-button"
          data-action="close-drawer"
          aria-label="关闭详情"
        >
          <svg><use href="#close" /></svg>
        </button>
      </div>
      <div id="drawer-body"></div>
      <div class="dialog-footer">
        <button class="primary" data-action="close-drawer">完成</button>
      </div>
    </dialog>
    <input
      type="file"
      id="file-picker"
      accept="video/*,.mkv,.mov,.webm,.ts"
      multiple
      hidden
    /><input type="file" id="folder-picker" webkitdirectory multiple hidden />
    <script src="app.js"></script>
  </body>
</html>
